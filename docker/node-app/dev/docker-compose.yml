services:
  node-dev:
    image: 043207749006.dkr.ecr.us-east-1.amazonaws.com/varunerp/node-app:dev
    container_name: node-dev
    restart: unless-stopped
    ports:
      # Host 3001 is the target_port this environment's NLB target group
      # points at (see terraform/shared). Only the host side differs
      # between dev/qa — the app always listens on 3000 inside the container.
      - "3001:3000"
    env_file:
      - .env
      - .env.secrets # fetched from Secrets Manager at deploy time, never committed
    mem_limit: 512m
    cpus: 0.5
    networks:
      - node-dev-net
    healthcheck:
      # node:24-alpine has no curl binary (confirmed live 2026-09-09 via
      # `docker inspect`'s Health.Log: "exec: \"curl\": executable file not
      # found in $PATH" on every single check since this container's first
      # deploy) — using node itself avoids adding a package to the runtime
      # image just for this.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        tag: "node-dev"
        max-size: "10m"
        max-file: "3"

networks:
  node-dev-net:
    driver: bridge
